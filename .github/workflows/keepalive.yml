name: Keep backend warm

# A tiny daily request to the backend so the free project never auto-pauses,
# keeping messaging + SOS available 24/7.
on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://zwpcronmiotlokpdcrhs.supabase.co/rest/v1/cx_members?select=id&limit=1" \
            -H "apikey: sb_publishable_XekL5fEOblxYziMMz0-yGg_-LsBnWsX")
          echo "Supabase responded: $code"
